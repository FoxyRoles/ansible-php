[PHP]
expose_php = Off
user_ini.filename =
include_path = .

post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 1000

error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
display_errors = Off

[Date]
date.timezone = Europe/Prague

[Session]
; 1 month
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000
