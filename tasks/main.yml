---

- name: Install PHP
  ansible.builtin.import_tasks: install.yml

- name: Configure PHP
  ansible.builtin.import_tasks: configure.yml

- name: Configure PHP FPM logging
  ansible.builtin.import_tasks: logging.yml
  when: "'fpm' in php_modules"

- name: Configure PHP FPM pools
  ansible.builtin.import_tasks: pools.yml
  when: "'fpm' in php_modules"

- name: "Start PHP FPM {{ php_version }}"
  ansible.builtin.service:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
  when: "'fpm' in php_modules"
